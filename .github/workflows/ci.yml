name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/initial-production-build

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit, schema, authorization, and tenant-isolation tests
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build production artifacts
        run: pnpm build

  public-e2e:
    name: Public Playwright E2E
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @optimalen-nakup/web exec playwright install --with-deps chromium

      - name: Build application
        run: pnpm build

      - name: Run desktop and mobile E2E
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  containers:
    name: Container build and startup
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate shell scripts
        run: bash -n ops/scripts/*.sh

      - name: Prepare credential-free container environment
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          ACME_EMAIL=ci@example.invalid
          APP_DOMAIN=http://localhost
          GRAFANA_ADMIN_PASSWORD=ci-not-production
          WORKER_CONVEX_HTTP_URL=http://web:3000
          WORKER_SHARED_SECRET=ci-worker-shared-secret-with-32-bytes
          EOF

      - name: Validate Compose model
        run: docker compose --profile observability --profile backup config --quiet

      - name: Build web and worker images
        run: |
          docker build --target web --tag optimalen-nakup-web:ci --build-arg APP_VERSION="${GITHUB_SHA}" --file ops/docker/Dockerfile .
          docker build --target worker --tag optimalen-nakup-worker:ci --build-arg APP_VERSION="${GITHUB_SHA}" --file ops/docker/Dockerfile .
          docker build --target backup --tag optimalen-nakup-backup:ci --build-arg APP_VERSION="${GITHUB_SHA}" --file ops/docker/Dockerfile .

      - name: Start core services
        env:
          APP_VERSION: ci
          BACKUP_IMAGE: optimalen-nakup-backup:ci
          WEB_IMAGE: optimalen-nakup-web:ci
          WORKER_IMAGE: optimalen-nakup-worker:ci
        run: |
          docker compose --profile observability up --detach --no-build \
            web worker caddy otel-collector prometheus loki grafana

      - name: Verify service health
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error http://localhost/api/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1

      - name: Verify observability services
        run: |
          running_services="$(docker compose --profile observability ps --status running --services)"
          for service in web worker caddy otel-collector prometheus loki grafana; do
            grep -qx "$service" <<<"$running_services"
          done
          docker compose exec --no-TTY worker node -e \
            "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
          curl --fail --silent --show-error http://127.0.0.1:9090/-/ready
          curl --fail --silent --show-error http://127.0.0.1:3002/api/health

      - name: Capture container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 300 web worker caddy

      - name: Stop containers
        if: always()
        run: docker compose --profile observability down --volumes --remove-orphans

  lighthouse-public:
    name: Public Lighthouse 100 gate
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @optimalen-nakup/web exec playwright install --with-deps chromium

      - name: Locate Chromium
        run: |
          chrome_path="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' -print -quit)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Build and start production application
        run: |
          pnpm build
          nohup pnpm --filter @optimalen-nakup/web start > /tmp/optimalen-nakup-web.log 2>&1 &
          echo "$!" > /tmp/optimalen-nakup-web.pid
          for attempt in $(seq 1 24); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/optimalen-nakup-web.log
          exit 1

      - name: Run three mobile Lighthouse passes
        id: lighthouse-mobile
        continue-on-error: true
        run: pnpm lighthouse:public:mobile

      - name: Reset Lighthouse working directory
        if: always() && steps.lighthouse-mobile.outcome != 'skipped'
        run: rm -rf "$GITHUB_WORKSPACE/.lighthouseci"

      - name: Run three desktop Lighthouse passes
        id: lighthouse-desktop
        if: always() && steps.lighthouse-mobile.outcome != 'skipped'
        continue-on-error: true
        run: pnpm lighthouse:public:desktop

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-public
          path: lighthouse-reports
          if-no-files-found: ignore
          retention-days: 30

      - name: Show server log
        if:
          always() && (steps.lighthouse-mobile.outcome != 'success' ||
          steps.lighthouse-desktop.outcome != 'success')
        run: cat /tmp/optimalen-nakup-web.log

      - name: Stop production application
        if: always()
        run: |
          if test -f /tmp/optimalen-nakup-web.pid; then
            kill "$(cat /tmp/optimalen-nakup-web.pid)" || true
          fi

      - name: Enforce both Lighthouse profiles
        if: always()
        env:
          DESKTOP_OUTCOME: ${{ steps.lighthouse-desktop.outcome }}
          MOBILE_OUTCOME: ${{ steps.lighthouse-mobile.outcome }}
        run: |
          test "$MOBILE_OUTCOME" = success
          test "$DESKTOP_OUTCOME" = success
